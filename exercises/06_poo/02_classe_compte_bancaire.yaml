          pass

      def get_balance(self):
          pass

  def test_account(operations):
      # Crée un compte avec 100, exécute operations, retourne le solde
      pass

hints:
  - "Stocke le solde dans self.balance"
  - "deposit ajoute au solde : self.balance += montant"
  - "withdraw retire du solde : self.balance -= montant"
  - "Parse chaque opération : operation.split(':') pour séparer type et montant"

tests:
  - input: [["deposit:50"]]
    expected: 150
    description: "Un dépôt"
  - input: [["withdraw:30"]]
    expected: 70
    description: "Un retrait"
  - input: [["deposit:50", "withdraw:30"]]
    expected: 120
    description: "Dépôt puis retrait"
  - input: [[]]
    expected: 100
    description: "Aucune opération"
  - input: [["deposit:100", "deposit:50", "withdraw:75"]]
    expected: 175
    hidden: true
    description: "Plusieurs opérations"

