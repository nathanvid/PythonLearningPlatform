id: "rectangle_class"
title: "Classe Rectangle"
description: |
  Crée une classe Rectangle avec :
  - Un constructeur __init__(self, largeur, hauteur)
  - Une méthode area(self) qui retourne l'aire (largeur × hauteur)
  - Une méthode perimeter(self) qui retourne le périmètre (2 × (largeur + hauteur))

  Ensuite, crée une fonction get_rectangle_area(largeur, hauteur) qui crée
  un Rectangle et retourne son aire.

  Exemple :
  - get_rectangle_area(5, 3) → 15

