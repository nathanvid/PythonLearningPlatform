          # Retourne le périmètre
          pass

  def get_rectangle_area(largeur, hauteur):
      # Crée un Rectangle et retourne son aire
      pass

hints:
  - "Utilise self.largeur et self.hauteur pour stocker les dimensions"
  - "L'aire = largeur × hauteur"
  - "Le périmètre = 2 × (largeur + hauteur)"
  - "Dans get_rectangle_area, crée un Rectangle puis appelle .area()"

tests:
  - input: [5, 3]
    expected: 15
    description: "Aire d'un rectangle 5×3"
  - input: [10, 2]
    expected: 20
    description: "Aire d'un rectangle 10×2"
  - input: [4, 4]
    expected: 16
    description: "Aire d'un carré 4×4"
  - input: [7, 8]
    expected: 56
    hidden: true
    description: "Aire cachée"
  - input: [1, 100]
    expected: 100
    hidden: true
    description: "Rectangle très allongé"

