            pass

        def speak(self):
            pass

        def get_breed(self):
            pass

    def create_dog_speak(name, breed):
        # Create a Dog and return what it says
        pass
  hints:
    - "In Dog.__init__, call super().__init__(name) to initialize the name"
    - "Store the breed with self.breed"
    - "In speak(), use an f-string with self.name"
