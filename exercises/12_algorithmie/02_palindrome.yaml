id: "is_palindrome"
title: "Vérifier un palindrome"
description: |
  Un **palindrome** se lit de la même façon dans les deux sens, comme `"radar"`.
  Complète la fonction `is_palindrome(text)` pour qu'elle renvoie `True` si `text` est un palindrome, en **ignorant les espaces et les majuscules**, et `False` sinon.

  Exemples :
  - `is_palindrome("radar")` renvoie `True`
  - `is_palindrome("hello")` renvoie `False`
  - `is_palindrome("Never odd or even")` renvoie `True`

template: |
  def is_palindrome(text):
      # Écris ton code ici
      pass

solution: |
  def is_palindrome(text):
      clean = text.lower().replace(" ", "")
      return clean == clean[::-1]

hints:
  - "Nettoie d'abord le texte (`lower()`, `replace(\" \", \"\")`), puis compare-le à `text[::-1]`."

tests:
  - input: ["radar"]
    expected: true
    description: "Palindrome simple"
  - input: ["hello"]
    expected: false
    description: "Pas un palindrome"
  - input: ["kayak"]
    expected: true
    description: "Autre palindrome"
  - input: ["a"]
    expected: true
    description: "Une seule lettre"
  - input: ["Radar"]
    expected: true
    description: "Avec majuscule"
  - input: ["A man a plan a canal Panama"]
    expected: true
    hidden: true
    description: "Phrase palindrome"
  - input: ["Never odd or even"]
    expected: true
    hidden: true
    description: "Phrase complexe"

