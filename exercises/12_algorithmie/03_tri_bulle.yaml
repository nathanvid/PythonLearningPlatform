id: "bubble_sort"
title: "Tri à bulles"
description: |
  Complète la fonction `bubble_sort(arr)` pour qu'elle renvoie la liste triée par ordre croissant, **sans** `sort` ni `sorted`, avec le **tri à bulles** :
  on parcourt la liste en échangeant deux voisins quand ils sont dans le mauvais ordre, et on recommence autant de fois qu'il y a d'éléments.

  Exemples :
  - `bubble_sort([3, 1, 2])` renvoie `[1, 2, 3]`
  - `bubble_sort([5, 2, 8, 1])` renvoie `[1, 2, 5, 8]`

template: |
  def bubble_sort(arr):
      # Implémente le tri à bulles
      pass

solution: |
  def bubble_sort(arr):
      for pass_number in range(len(arr)):
          for i in range(len(arr) - 1):
              if arr[i] > arr[i + 1]:
                  arr[i], arr[i + 1] = arr[i + 1], arr[i]
      return arr

hints:
  - "Deux boucles : `for pass_number in range(len(arr))`, et à l'intérieur `for i in range(len(arr) - 1)` avec l'échange vu dans la leçon."

tests:
  - input: [[3, 1, 2]]
    expected: [1, 2, 3]
    description: "Petite liste désordonnée"
  - input: [[5, 2, 8, 1]]
    expected: [1, 2, 5, 8]
    description: "Liste de 4 éléments"
  - input: [[1, 2, 3]]
    expected: [1, 2, 3]
    description: "Déjà triée"
  - input: [[3, 2, 1]]
    expected: [1, 2, 3]
    description: "Ordre inverse"
  - input: [[42]]
    expected: [42]
    description: "Un seul élément"
  - input: [[9, 7, 5, 3, 1]]
    expected: [1, 3, 5, 7, 9]
    hidden: true
    description: "Liste plus longue"
  - input: [[4, 4, 2, 2]]
    expected: [2, 2, 4, 4]
    hidden: true
    description: "Avec doublons"

en:
  title: "Bubble sort"
  description: |
    Complete the function `bubble_sort(arr)` so that it returns the list sorted in increasing order, **without** `sort` or `sorted`, using **bubble sort**:
    go through the list swapping two neighbours when they are in the wrong order, and start again as many times as there are items.

    Examples:
    - `bubble_sort([3, 1, 2])` returns `[1, 2, 3]`
    - `bubble_sort([5, 2, 8, 1])` returns `[1, 2, 5, 8]`
  template: |
    def bubble_sort(arr):
        # Implement bubble sort
        pass
  hints:
    - "Two loops: `for pass_number in range(len(arr))`, and inside it `for i in range(len(arr) - 1)` with the swap seen in the lesson."
  tests:
    - "Small unsorted list"
    - "List of 4 elements"
    - "Already sorted"
    - "Reverse order"
    - "A single element"
    - "Longer list"
    - "With duplicates"
