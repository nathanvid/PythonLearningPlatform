  title: "Prime number"
  description: |
    Complete the function `is_prime(n)` so that it returns `True` if `n` is a **prime** number, and `False` otherwise.
    A prime number is a whole number greater than 1 that has only two divisors: 1 and itself.

    Examples:
    - `is_prime(7)` returns `True`
    - `is_prime(4)` returns `False` (4 is divisible by 2)
    - `is_prime(1)` returns `False`
  template: |
    def is_prime(n):
        # Write your code here
        pass
  hints:
    - "If a number `d` between 2 and `n - 1` divides `n` (`n % d == 0`), `n` is not prime."
  tests:
    - "2 is prime"
    - "7 is prime"
    - "4 is not prime"
    - "1 is not prime"
    - "15 is not prime"
    - "17 is prime"
    - "100 is not prime"
