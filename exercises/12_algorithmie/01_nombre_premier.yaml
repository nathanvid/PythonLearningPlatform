id: "is_prime"
title: "Nombre premier"
description: |
  Complète la fonction `is_prime(n)` pour qu'elle renvoie `True` si `n` est un nombre **premier**, et `False` sinon.
  Un nombre premier est un entier supérieur à 1 qui n'a que deux diviseurs : 1 et lui-même.

  Exemples :
  - `is_prime(7)` renvoie `True`
  - `is_prime(4)` renvoie `False` (4 est divisible par 2)
  - `is_prime(1)` renvoie `False`

template: |
  def is_prime(n):
      # Écris ton code ici
      pass

solution: |
  def is_prime(n):
      if n < 2:
          return False
      for d in range(2, n):
          if n % d == 0:
              return False
      return True

hints:
  - "Si un nombre `d` entre 2 et `n - 1` divise `n` (`n % d == 0`), `n` n'est pas premier."

tests:
  - input: [2]
    expected: true
    description: "2 est premier"
  - input: [7]
    expected: true
    description: "7 est premier"
  - input: [4]
    expected: false
    description: "4 n'est pas premier"
  - input: [1]
    expected: false
    description: "1 n'est pas premier"
  - input: [15]
    expected: false
    description: "15 n'est pas premier"
  - input: [17]
    expected: true
    hidden: true
    description: "17 est premier"
  - input: [100]
    expected: false
    hidden: true
    description: "100 n'est pas premier"

