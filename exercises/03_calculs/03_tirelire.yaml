id: "piggy_bank"
type: output
title: "La tirelire"
description: |
  1. Crée `piggy_bank = 20`.
  2. Mets à jour `piggy_bank` avec les raccourcis, dans cet ordre :
     - ajoute `15` avec `+=` ;
     - retire `8` avec `-=` ;
     - double la somme avec `*=`.
  3. Affiche `piggy_bank`.

  Le programme doit afficher exactement :

  ```text
  54
  ```

template: |
  piggy_bank = 20
  # Écris ton code ici

solution: |
  piggy_bank = 20
  piggy_bank += 15
  piggy_bank -= 8
  piggy_bank *= 2
  print(piggy_bank)

checks:
  variables:
    piggy_bank: 54
  uses: [piggy_bank]
  constructs: ["+="]

hints:
  - "`piggy_bank -= 8` veut dire `piggy_bank = piggy_bank - 8`."

