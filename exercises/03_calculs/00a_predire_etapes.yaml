id: "predict_calc_steps"
type: predict
title: "Prédire : division, reste et mise à jour"
description: |
  Lis le code et prédis exactement ce qu'il affiche.

  À chaque étape, le code s'allonge : suis la valeur de `x` à chaque ligne.

steps:
  - |
    x = 17
    print(x // 5)
  - |
    x = 17
    print(x // 5)
    print(x % 5)
  - |
    x = 17
    print(x // 5)
    print(x % 5)
    x += 3
    print(x)

code: |
  x = 17
  print(x // 5)
  print(x % 5)
  x += 3
  print(x)
  print(x / 4, x ** 2)

hints:
  - "`x += 3` change la valeur de x pour toutes les lignes suivantes."

en:
