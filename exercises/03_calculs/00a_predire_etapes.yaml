    Read the code and predict exactly what it displays.

    At each step, the code grows: follow the value of `x` on each line.
  steps:
    - |
      x = 17
      print(x // 5)
    - |
      x = 17
      print(x // 5)
      print(x % 5)
    - |
      x = 17
      print(x // 5)
      print(x % 5)
      x += 3
      print(x)
  code: |
    x = 17
    print(x // 5)
    print(x % 5)
    x += 3
    print(x)
    print(x / 4, x ** 2)
  hints:
    - "`x += 3` changes the value of x for all the following lines."
