  title: "Inheritance - Animal and Dog classes"
  description: |
    Complete two classes:

    1. `Animal`:
       - `__init__(self, name)` stores the name in an attribute;
       - `speak(self)` returns `"I am an animal"`.

    2. `Dog`, which inherits from `Animal`:
       - `__init__(self, name, breed)` calls the parent constructor with `super().__init__(name)`, then stores the breed;
       - `speak(self)` returns `"Woof! I am "` followed by the name;
       - `get_breed(self)` returns the breed.

    Then complete `create_dog_speak(name, breed)`, which creates a `Dog` and returns what its `speak()` method returns.

    Example:
    - `create_dog_speak("Rex", "Labrador")` returns `"Woof! I am Rex"`
