        # Create a Dog and return what it says
        pass
  solution: |
    class Animal:
        def __init__(self, name):
            self.name = name
    
        def speak(self):
            return "I am an animal"
    
    class Dog(Animal):
        def __init__(self, name, breed):
            super().__init__(name)
            self.breed = breed
    
        def speak(self):
            return "Woof! I am " + self.name
    
        def get_breed(self):
            return self.breed
    
    def create_dog_speak(name, breed):
        return Dog(name, breed).speak()
  hints:
    - "`super().__init__(name)` runs the constructor of `Animal`, which stores the name."
  tests:
    - input: ["Rex", "Labrador"]
      expected: "Woof! I am Rex"
      description: "Rex the dog"
    - input: ["Max", "Shepherd"]
      expected: "Woof! I am Max"
      description: "Max the dog"
    - input: ["Bella", "Poodle"]
      expected: "Woof! I am Bella"
      description: "Bella the dog"
    - expected: "Woof! I am Rocky"
      description: "Hidden test"
