  class Rectangle:
      def __init__(self, width, height):
          # Initialise les attributs
          pass

      def area(self):
          # Retourne l'aire
          pass

      def perimeter(self):
          # Retourne le périmètre
          pass

  def get_rectangle_area(width, height):
      # Crée un Rectangle et retourne son aire
      pass

solution: |
  class Rectangle:
      def __init__(self, width, height):
          self.width = width
          self.height = height
  
      def area(self):
          return self.width * self.height
  
      def perimeter(self):
          return 2 * (self.width + self.height)
  
  def get_rectangle_area(width, height):
      return Rectangle(width, height).area()

hints:
  - "Dans les méthodes, les dimensions se lisent avec `self.width` et `self.height`."

tests:
  - input: [5, 3]
    expected: 15
    description: "Aire d'un rectangle 5×3"
  - input: [10, 2]
    expected: 20
    description: "Aire d'un rectangle 10×2"
  - input: [4, 4]
    expected: 16
    description: "Aire d'un carré 4×4"
  - input: [7, 8]
    expected: 56
    hidden: true
    description: "Aire cachée"
  - input: [1, 100]
    expected: 100
    hidden: true
    description: "Rectangle très allongé"

