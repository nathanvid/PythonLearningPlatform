id: "rectangle_class"
title: "Classe Rectangle"
description: |
  Complète la classe `Rectangle` :
  - le constructeur `__init__(self, width, height)` range les deux valeurs dans des attributs ;
  - la méthode `area(self)` renvoie l'aire (largeur × hauteur) ;
  - la méthode `perimeter(self)` renvoie le périmètre (2 × (largeur + hauteur)).

  Puis complète la fonction `get_rectangle_area(width, height)`, qui crée un `Rectangle` et renvoie son aire.

  Exemples :
  - `get_rectangle_area(5, 3)` renvoie `15`
  - `get_rectangle_area(4, 4)` renvoie `16`

