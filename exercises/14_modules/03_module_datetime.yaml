id: "use_datetime_module"
title: "Module datetime - Différence de jours"
description: |
  Complète la fonction `days_between(date1_str, date2_str)` pour qu'elle renvoie le nombre de jours entre deux dates écrites au format `"AAAA-MM-JJ"`.
  Le résultat est toujours positif, quel que soit l'ordre des deux dates.

  Exemples :
  - `days_between("2024-01-01", "2024-01-10")` renvoie `9`
  - `days_between("2024-01-10", "2024-01-01")` renvoie `9`
  - `days_between("2024-01-01", "2024-01-01")` renvoie `0`

template: |
  def days_between(date1_str, date2_str):
      # Calcule la différence en jours
      pass

solution: |
  from datetime import date
  
  def days_between(date1_str, date2_str):
      d1 = date.fromisoformat(date1_str)
      d2 = date.fromisoformat(date2_str)
      return abs((d2 - d1).days)

hints:
  - "`date.fromisoformat(texte)` lit une date ; `abs(...)` rend un nombre positif."

tests:
  - input: ["2024-01-01", "2024-01-10"]
    expected: 9
    description: "9 jours de différence"
  - input: ["2024-12-25", "2024-12-31"]
    expected: 6
    description: "6 jours de différence"
  - input: ["2024-01-01", "2024-01-01"]
    expected: 0
    description: "Même date"
  - input: ["2024-01-10", "2024-01-01"]
    expected: 9
    hidden: true
    description: "Date2 avant date1"
  - input: ["2024-01-01", "2024-12-31"]
    expected: 365
    hidden: true
    description: "Presque une année"

