id: "use_math_module"
title: "Module math - Racine carrée"
description: |
  Complète la fonction `calculate_hypotenuse(a, b)` pour qu'elle renvoie la longueur de l'hypoténuse d'un triangle rectangle de côtés `a` et `b`,
  avec le théorème de Pythagore : `c = √(a² + b²)`. Utilise `math.sqrt` pour la racine carrée.

  Exemples :
  - `calculate_hypotenuse(3, 4)` renvoie `5.0`
  - `calculate_hypotenuse(5, 12)` renvoie `13.0`

template: |
  def calculate_hypotenuse(a, b):
      # Importe math et calcule l'hypoténuse
      pass

solution: |
  import math
  
  def calculate_hypotenuse(a, b):
      return math.sqrt(a ** 2 + b ** 2)

hints:
  - "N'oublie pas `import math` en haut du code."

tests:
  - input: [3, 4]
    expected: 5.0
    description: "Triangle 3-4-5"
  - input: [5, 12]
    expected: 13.0
    description: "Triangle 5-12-13"
  - input: [1, 1]
    expected: 1.4142135623730951
    description: "Triangle isocèle"
  - input: [8, 15]
    expected: 17.0
    hidden: true
    description: "Triangle 8-15-17"

