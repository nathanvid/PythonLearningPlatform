    Examples:
    - `averages({"Ada": [10, 20]})` returns `{"Ada": 15.0}`
    - `averages({"Ada": [12, 14], "Alan": [9, 11, 13]})` returns `{"Ada": 13.0, "Alan": 11.0}`
  template: |
    def averages(grades):
        # Write your code here
        pass
  hints:
    - "For each pair of `grades.items()`, the average is `sum(items) / len(items)`."
  tests:
