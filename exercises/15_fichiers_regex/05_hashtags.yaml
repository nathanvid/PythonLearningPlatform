id: "regex_hashtags"
title: "Extraire des hashtags"
description: |
  Un hashtag est un `#` suivi d'une ou plusieurs lettres, chiffres ou `_`.
  Complète la fonction `find_hashtags(text)` pour qu'elle renvoie la liste des hashtags du texte, **sans** le `#`, en minuscules, dans l'ordre où ils apparaissent.

  Exemples :
  - `find_hashtags("J'adore #Python et #code_2026 !")` renvoie `["python", "code_2026"]`
  - `find_hashtags("Rien ici")` renvoie `[]`

template: |
  import re

  def find_hashtags(text):
      # Écris ton code ici
      pass

solution: |
  import re

  def find_hashtags(text):
      return [word.lower() for word in re.findall(r"#(\w+)", text)]

hints:
  - "Avec des parenthèses, `re.findall(r\"#(\\w+)\", text)` ne renvoie que ce qui est entre parenthèses."

tests:
  - input: ["J'adore #Python et #code_2026 !"]
    expected: ["python", "code_2026"]
    description: "Deux hashtags"
  - input: ["Rien ici"]
    expected: []
    description: "Aucun hashtag"
  - input: ["#a#b"]
    expected: ["a", "b"]
    description: "Collés"
  - input: ["Un # tout seul et #OK"]
    expected: ["ok"]
    hidden: true
    description: "Un # sans mot"

