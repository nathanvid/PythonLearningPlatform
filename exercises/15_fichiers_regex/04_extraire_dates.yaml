  tests:
    - input: ["Due on 15/03/2026, oral exam on 02/04/2026"]
      description: "Two dates"
    - input: ["No date here"]
      description: "No date"
    - input: ["Born on 01/01/2010."]
      description: "Date followed by a period"
    - input: ["5/3/2026 does not count, 05/03/2026 does"]
      description: "Incomplete format ignored"
