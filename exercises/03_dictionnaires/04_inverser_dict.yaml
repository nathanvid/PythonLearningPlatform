id: "invert_dict"
title: "Inverser un dictionnaire"
description: |
  Crée une fonction invert_dict(d) qui inverse les clés et les valeurs
  d'un dictionnaire.

  Les anciennes clés deviennent les valeurs, et les anciennes valeurs
  deviennent les clés.

  Exemples :
  - invert_dict({"a": 1, "b": 2}) → {1: "a", 2: "b"}
  - invert_dict({"nom": "Alice"}) → {"Alice": "nom"}

template: |
  def invert_dict(d):
      # Inverse clés et valeurs
      pass

hints:
  - "Utilise une dict comprehension"
  - "Syntaxe : {value: key for key, value in d.items()}"
  - ".items() retourne les paires (clé, valeur)"

tests:
  - input: [{"a": 1, "b": 2}]
    expected: {1: "a", 2: "b"}
    description: "Dictionnaire simple"
  - input: [{"nom": "Alice", "age": 25}]
    expected: {"Alice": "nom", 25: "age"}
    description: "Valeurs mixtes"
  - input: [{}]
    expected: {}
    description: "Dictionnaire vide"
  - input: [{"x": 10, "y": 20, "z": 30}]
    expected: {10: "x", 20: "y", 30: "z"}
    hidden: true
    description: "Trois éléments"

en:
  title: "Invert a dictionary"
  description: |
    Create a function invert_dict(d) that swaps the keys and the values
    of a dictionary.

    The old keys become the values, and the old values
    become the keys.

    Examples:
    - invert_dict({"a": 1, "b": 2}) → {1: "a", 2: "b"}
    - invert_dict({"name": "Alice"}) → {"Alice": "name"}
  template: |
    def invert_dict(d):
        # Swap keys and values
        pass
  hints:
    - "Use a dict comprehension"
    - "Syntax: {value: key for key, value in d.items()}"
    - ".items() returns the (key, value) pairs"
  tests:
    - "Simple dictionary"
    - "Mixed values"
    - "Empty dictionary"
    - "Three elements"
