id: "filter_even_list_comp"
title: "Filtrer les nombres pairs"
description: |
  Complète la fonction `filter_even(numbers)` pour qu'elle renvoie la liste des nombres **pairs** de `numbers`, dans le même ordre, avec une **liste en compréhension** et une condition.

  Exemples :
  - `filter_even([1, 2, 3, 4, 5])` renvoie `[2, 4]`
  - `filter_even([1, 3, 5])` renvoie `[]`
  - `filter_even([0, -2, 3])` renvoie `[0, -2]`

template: |
  def filter_even(numbers):
      # Utilise une list comprehension avec if
      pass

solution: |
  def filter_even(numbers):
      return [n for n in numbers if n % 2 == 0]

hints:
  - "`[n for n in numbers if ...]`, avec la condition « n est pair »."

tests:
  - input: [[1, 2, 3, 4, 5]]
    expected: [2, 4]
    description: "Liste mixte"
  - input: [[10, 15, 20, 25]]
    expected: [10, 20]
    description: "Nombres plus grands"
  - input: [[1, 3, 5, 7]]
    expected: []
    description: "Que des impairs"
  - input: [[2, 4, 6, 8]]
    expected: [2, 4, 6, 8]
    description: "Que des pairs"
  - input: [[]]
    expected: []
    description: "Liste vide"
  - input: [[0, -2, -4, 3, 5]]
    expected: [0, -2, -4]
    hidden: true
    description: "Avec nombres négatifs et zéro"

en:
  title: "Filter even numbers"
  description: |
    Complete the function `filter_even(numbers)` so that it returns the list of the **even** numbers of `numbers`, in the same order, with a **list comprehension** and a condition.

    Examples:
    - `filter_even([1, 2, 3, 4, 5])` returns `[2, 4]`
    - `filter_even([1, 3, 5])` returns `[]`
    - `filter_even([0, -2, 3])` returns `[0, -2]`
  template: |
    def filter_even(numbers):
        # Use a list comprehension with if
        pass
  hints:
    - "`[n for n in numbers if ...]`, with the condition \"n is even\"."
  tests:
    - "Mixed list"
    - "Larger numbers"
    - "Only odd numbers"
    - "Only even numbers"
    - "Empty list"
    - "With negative numbers and zero"
