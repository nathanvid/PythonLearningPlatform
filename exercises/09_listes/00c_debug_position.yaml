id: "fix_find_position"
type: fix
title: "Débogage : position d'un élément"
description: |
  La fonction position(liste, valeur) doit renvoyer l'indice de la première occurrence
  de valeur dans la liste, ou -1 si elle n'y est pas.
  Un des tests échoue : trouve pourquoi et corrige le code.

template: |
  def position(items, value):
      for i in range(1, len(items)):
          if items[i] == value:
              return i
      return -1

solution: |
  def position(items, value):
      for i in range(len(items)):
          if items[i] == value:
              return i
      return -1

hints:
  - "Les indices d'une liste commencent à 0 : quel indice la boucle teste-t-elle en premier ?"

tests:
  - input: [[3, 7, 9], 7]
    expected: 1
    description: "Valeur au milieu"
  - input: [[3, 7, 9], 3]
    expected: 0
    description: "Valeur en première position"
  - input: [[3, 7, 9], 4]
    expected: -1
    description: "Valeur absente"
  - input: [[5], 5]
    expected: 0
    hidden: true
    description: "Liste d'un seul élément"

en:
  title: "Debugging: position of an item"
  description: |
    The function position(items, value) must return the index of the first occurrence
    of value in the list, or -1 if it isn't there.
    One of the tests fails: find out why and fix the code.
  template: |
    def position(items, value):
        for i in range(1, len(items)):
            if items[i] == value:
                return i
        return -1
  solution: |
    def position(items, value):
        for i in range(len(items)):
            if items[i] == value:
                return i
        return -1
  hints:
    - "List indexes start at 0: which index does the loop check first?"
  tests:
    - "Value in the middle"
    - "Value in first position"
    - "Missing value"
    - "Single-item list"
