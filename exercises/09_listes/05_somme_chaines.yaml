id: "sum_string_numbers"
title: "Somme de nombres en chaînes"
description: |
  Complète la fonction `sum_string_numbers(str_list)` : elle reçoit une liste de nombres écrits sous forme de **texte**, et renvoie leur somme sous forme de **nombre entier**.

  Exemples :
  - `sum_string_numbers(["1", "2", "3"])` renvoie `6`
  - `sum_string_numbers(["-5", "10", "-3"])` renvoie `2`
  - `sum_string_numbers([])` renvoie `0`

template: |
  def sum_string_numbers(str_list):
      # Écris ton code ici
      pass

solution: |
  def sum_string_numbers(str_list):
      total = 0
      for text in str_list:
          total += int(text)
      return total

hints:
  - "Convertis chaque texte avec `int()` avant de l'ajouter au total."

tests:
  - input: [["1", "2", "3"]]
    expected: 6
    description: "Trois petits nombres"
  - input: [["10", "20", "30"]]
    expected: 60
    description: "Nombres plus grands"
  - input: [["0"]]
    expected: 0
    description: "Un seul zéro"
  - input: [[]]
    expected: 0
    description: "Liste vide"
  - input: [["100", "200", "300"]]
    expected: 600
    hidden: true
    description: "Grands nombres"
  - input: [["-5", "10", "-3"]]
    expected: 2
    hidden: true
    description: "Nombres négatifs"

