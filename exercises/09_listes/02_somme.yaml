id: "sum_list"
title: "Somme des éléments"
description: |
  Complète la fonction `sum_list(numbers)` pour qu'elle renvoie la somme des nombres de la liste.

  Exemples :
  - `sum_list([1, 2, 3, 4, 5])` renvoie `15`
  - `sum_list([10, -5, 3])` renvoie `8`
  - `sum_list([])` renvoie `0`

template: |
  def sum_list(numbers):
      # Écris ton code ici
      pass

solution: |
  def sum_list(numbers):
      total = 0
      for n in numbers:
          total += n
      return total

hints:
  - "Une boucle `for` avec un accumulateur, ou la fonction `sum`."

tests:
  - input: [[1, 2, 3, 4, 5]]
    expected: 15
    description: "Somme de 1 à 5"
  - input: [[10, -5, 3]]
    expected: 8
    description: "Somme avec des nombres négatifs"
  - input: [[]]
    expected: 0
    description: "Liste vide"
  - input: [[100]]
    expected: 100
    description: "Liste avec un seul élément"

