id: "id_card_variables"
type: output
title: "Carte d'identité"
description: |
  1. Crée trois variables :
     - `name` qui contient `"Léa"` ;
     - `city` qui contient `"Nantes"` ;
     - `age` qui contient le nombre `14`.
  2. Affiche-les avec trois `print` qui utilisent ces variables.

  Le programme doit afficher exactement :

  ```text
  Prénom : Léa
  Ville : Nantes
  Âge : 14
  ```

template: |
  # Crée les trois variables ici

  # Affiche-les ici

solution: |
  name = "Léa"
  city = "Nantes"
  age = 14
  print("Prénom :", name)
  print("Ville :", city)
  print("Âge :", age)

checks:
  variables:
    name: "Léa"
    city: "Nantes"
    age: 14
  uses: [name, city, age]

hints:
  - "`print(\"Prénom :\", name)` affiche le texte, un espace, puis la valeur de la variable."

en:
