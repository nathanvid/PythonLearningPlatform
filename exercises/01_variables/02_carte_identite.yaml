    1. Create three variables:
       - `name` that holds `"Lea"`;
       - `city` that holds `"Nantes"`;
       - `age` that holds the number `14`.
    2. Display them with three `print` calls that use these variables.

    The program must display exactly:

    ```text
    Name: Lea
    City: Nantes
    Age: 14
    ```
  template: |
    # Create the three variables here

    # Display them here
  solution: |
    name = "Lea"
    city = "Nantes"
    age = 14
    print("Name:", name)
    print("City:", city)
    print("Age:", age)
  checks:
