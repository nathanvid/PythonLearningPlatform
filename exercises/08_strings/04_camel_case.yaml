    Complete the function `to_camel_case(text)` so that it returns the text in "CamelCase": each word starts with a capital letter, and the words are joined without spaces.

    Examples:
    - `to_camel_case("hello world")` returns `"HelloWorld"`
    - `to_camel_case("python is great")` returns `"PythonIsGreat"`
    - `to_camel_case("")` returns `""`
  template: |
    def to_camel_case(text):
        # Convert to CamelCase
        pass
  hints:
    - "For each word of `text.split()`, join `word[0].upper() + word[1:]` to a result that starts from `\"\"`."
  tests:
    - "Two simple words"
    - input: ["python is great"]
      expected: "PythonIsGreat"
      description: "Three words"
    - input: ["hello"]
      expected: "Hello"
      description: "A single word"
    - "Empty string"
    - "Four words"
