id: "reverse_words"
title: "Inverser l'ordre des mots"
description: |
  Crée une fonction reverse_words(sentence) qui inverse l'ordre des mots
  dans une phrase, mais garde chaque mot intact.

  Exemples :
  - reverse_words("Hello World") → "World Hello"
  - reverse_words("Python est génial") → "génial est Python"

template: |
  def reverse_words(sentence):
      # Inverse l'ordre des mots
      pass

hints:
  - "Utilise .split() pour séparer la phrase en mots"
  - "Inverse la liste avec [::-1] ou reversed()"
  - "Rejoins avec ' '.join()"

tests:
  - input: ["Hello World"]
    expected: "World Hello"
    description: "Deux mots"
  - input: ["Python est génial"]
    expected: "génial est Python"
    description: "Trois mots"
  - input: ["Bonjour"]
    expected: "Bonjour"
    description: "Un seul mot"
  - input: [""]
    expected: ""
    description: "Chaîne vide"
  - input: ["a b c d e"]
    expected: "e d c b a"
    hidden: true
    description: "Cinq mots"

en:
  title: "Reverse the order of words"
  description: |
    Create a function reverse_words(sentence) that reverses the order of the words
    in a sentence, but keeps each word intact.

    Examples:
    - reverse_words("Hello World") → "World Hello"
    - reverse_words("Python is awesome") → "awesome is Python"
  template: |
    def reverse_words(sentence):
        # Reverse the order of the words
        pass
  hints:
    - "Use .split() to split the sentence into words"
    - "Reverse the list with [::-1] or reversed()"
    - "Join them back with ' '.join()"
  tests:
    - "Two words"
    - input: ["Python is awesome"]
      expected: "awesome is Python"
      description: "Three words"
    - input: ["Hello"]
      expected: "Hello"
      description: "A single word"
    - "Empty string"
    - "Five words"
