id: "binary_search"
title: "Recherche binaire"
description: |
  Implémente l'algorithme de recherche binaire dans une fonction
  binary_search(arr, target) qui cherche target dans un tableau trié arr.

  La fonction doit retourner l'index de l'élément si trouvé, sinon -1.

  La recherche binaire divise le tableau en deux à chaque étape,
  comparant l'élément du milieu avec la cible.

  Exemples :
  - binary_search([1, 2, 3, 4, 5], 3) → 2
  - binary_search([1, 2, 3, 4, 5], 6) → -1

template: |
  def binary_search(arr, target):
      # Implémente la recherche binaire
      pass

hints:
  - "Utilise deux pointeurs : left = 0 et right = len(arr) - 1"
  - "Calcule le milieu : mid = (left + right) // 2"
  - "Si arr[mid] == target, retourne mid"
  - "Si arr[mid] < target, cherche à droite (left = mid + 1)"
  - "Si arr[mid] > target, cherche à gauche (right = mid - 1)"
  - "Continue tant que left <= right"

tests:
  - input: [[1, 2, 3, 4, 5], 3]
    expected: 2
    description: "Élément au milieu"
  - input: [[1, 2, 3, 4, 5], 1]
    expected: 0
    description: "Premier élément"
  - input: [[1, 2, 3, 4, 5], 5]
    expected: 4
    description: "Dernier élément"
  - input: [[1, 2, 3, 4, 5], 6]
    expected: -1
    description: "Élément non trouvé"
  - input: [[10], 10]
    expected: 0
    description: "Un seul élément"
  - input: [[1, 3, 5, 7, 9, 11, 13], 7]
    expected: 3
    hidden: true
    description: "Liste plus longue"
  - input: [[2, 4, 6, 8, 10], 5]
    expected: -1
    hidden: true
    description: "Valeur entre deux éléments"

en:
  title: "Binary search"
  description: |
    Implement the binary search algorithm in a function
    binary_search(arr, target) that looks for target in a sorted array arr.

    The function must return the index of the element if found, otherwise -1.

    Binary search splits the array in two at each step,
    comparing the middle element with the target.

    Examples:
    - binary_search([1, 2, 3, 4, 5], 3) → 2
    - binary_search([1, 2, 3, 4, 5], 6) → -1
  template: |
    def binary_search(arr, target):
        # Implement binary search
        pass
  hints:
    - "Use two pointers: left = 0 and right = len(arr) - 1"
    - "Compute the middle: mid = (left + right) // 2"
    - "If arr[mid] == target, return mid"
    - "If arr[mid] < target, search on the right (left = mid + 1)"
    - "If arr[mid] > target, search on the left (right = mid - 1)"
    - "Keep going while left <= right"
  tests:
    - "Element in the middle"
    - "First element"
    - "Last element"
    - "Element not found"
    - "A single element"
    - "Longer list"
    - "Value between two elements"
