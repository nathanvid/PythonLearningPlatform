        pass

    def hangman(word, letters):
        found = set()     # proposed letters
        lives = 6
        for letter in letters:
            # To do: stop the game if it is over,
            # otherwise handle the letter
            pass
        # To do: compute the status and return the tuple
        pass
  solution: |
    def mask_word(word, found):
        return "".join(c if c in found else "_" for c in word)
    
    def hangman(word, letters):
        found = set()
        lives = 6
        for letter in letters:
            if lives == 0 or "_" not in mask_word(word, found):
                break
            if letter not in word and letter not in found:
                lives -= 1
            found.add(letter)
        masked = mask_word(word, found)
        if "_" not in masked:
            status = "won"
        elif lives == 0:
            status = "lost"
        else:
            status = "in progress"
        return (masked, lives, status)
  hints:
    - "Start with `mask_word`, like the `mask` function of the lesson."
    - "In the loop, `break` as soon as `lives == 0` or the word is found, **before** handling the letter."
  tests:
    - expected: ["py____", 5, "in progress"]
      description: "Game in progress"
    - expected: ["chat", 6, "won"]
      description: "Win without a mistake"
    - expected: ["____", 0, "lost"]
      description: "Six mistakes: defeat"
    - expected: ["_anan_", 5, "in progress"]
      description: "Repeated letter: only one life lost"
    - expected: ["code", 6, "won"]
      description: "Letters ignored after the win"
    - expected: ["____", 0, "lost"]
      description: "Letters ignored after the defeat"
    - expected: ["_____", 6, "in progress"]
      description: "No letter proposed"
