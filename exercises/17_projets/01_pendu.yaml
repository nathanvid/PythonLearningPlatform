  title: "Project: the hangman game"
  description: |
    Program the engine of a hangman game, reusing the pieces built in the lesson.

    Complete the function `hangman(word, letters)` that simulates a game:
    - `word` is the word to guess (in lowercase);
    - `letters` is the list of guessed letters, in order;
    - the player starts with **6 lives**;
    - a letter missing from the word costs a life, **unless** it has already been guessed;
    - the game stops as soon as the word is found or the lives drop to 0: the following letters are ignored.

    The function returns the tuple `(masked_word, lives, status)`:
    - `masked_word`: the word with each letter not found replaced by `_`;
    - `lives`: the number of lives left;
    - `status`: `"won"`, `"lost"` or `"in progress"`.

    Examples:
    - `hangman("python", ["p", "y", "a"])` returns `("py____", 5, "in progress")`
    - `hangman("cat", ["c", "a", "t"])` returns `("cat", 6, "won")`
    - `hangman("cat", ["z", "x", "w", "v", "u", "s"])` returns `("___", 0, "lost")`
