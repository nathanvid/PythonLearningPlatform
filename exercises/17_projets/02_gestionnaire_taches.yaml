id: "project_todo_list"
title: "Projet : gestionnaire de tâches"
description: |
  Construis un petit gestionnaire de tâches, avec une classe, des listes et un dictionnaire.

  1. Complète la classe `TodoList` (ses deux listes `self.pending` et `self.finished` sont déjà créées) :
     - `add(title)` ajoute une tâche à faire ; ne fait rien si elle existe déjà, à faire ou terminée ;
     - `done(title)` marque une tâche à faire comme terminée ; ne fait rien si elle n'est pas dans les tâches à faire ;
     - `remove(title)` supprime la tâche, qu'elle soit à faire ou terminée ;
     - `summary()` renvoie le dictionnaire `{"pending": [...], "done": [...]}`, chaque liste dans l'ordre où les tâches y sont entrées.

  2. Complète `run_todo(commands)` : elle crée une `TodoList`, exécute les commandes une par une, puis renvoie `summary()`.
     Chaque commande est une liste `[action, titre]`, avec `action` parmi `"add"`, `"done"` et `"remove"`.

  Exemple :
  - `run_todo([["add", "Courses"], ["add", "Devoirs"], ["done", "Courses"]])` renvoie `{"pending": ["Devoirs"], "done": ["Courses"]}`

template: |
  class TodoList:
      def __init__(self):
          self.pending = []
          self.finished = []

      def add(self, title):
          pass

      def done(self, title):
          pass

      def remove(self, title):
          pass

      def summary(self):
          pass

  def run_todo(commands):
      todo = TodoList()
      for action, title in commands:
          # Appelle la bonne méthode selon l'action
          pass
      return todo.summary()

solution: |
  class TodoList:
      def __init__(self):
          self.pending = []
          self.finished = []
  
      def add(self, title):
          if title not in self.pending and title not in self.finished:
              self.pending.append(title)
  
      def done(self, title):
          if title in self.pending:
              self.pending.remove(title)
              self.finished.append(title)
  
      def remove(self, title):
          if title in self.pending:
              self.pending.remove(title)
          if title in self.finished:
              self.finished.remove(title)
  
      def summary(self):
          return {"pending": self.pending, "done": self.finished}
  
  def run_todo(commands):
      todo = TodoList()
      for action, title in commands:
          if action == "add":
              todo.add(title)
          elif action == "done":
              todo.done(title)
          elif action == "remove":
              todo.remove(title)
      return todo.summary()

hints:
  - "Écris et vérifie une méthode à la fois, en commençant par `add` et `summary`."
  - "Dans `run_todo` : `if action == \"add\": todo.add(title)`, puis la même chose pour `done` et `remove`."

tests:
  - input: [[["add", "Courses"], ["add", "Devoirs"], ["done", "Courses"]]]
    expected: { "pending": ["Devoirs"], "done": ["Courses"] }
    description: "Ajouter puis terminer"
  - input: [[]]
    expected: { "pending": [], "done": [] }
    description: "Aucune commande"
  - input: [[["add", "A"], ["add", "B"], ["remove", "A"]]]
    expected: { "pending": ["B"], "done": [] }
    description: "Supprimer une tâche"
  - input: [[["add", "A"], ["done", "Z"]]]
    expected: { "pending": ["A"], "done": [] }
    description: "Terminer une tâche inconnue"
  - input: [[["add", "A"], ["add", "A"]]]
    expected: { "pending": ["A"], "done": [] }
    hidden: true
    description: "Pas de doublon"
  - input:
      [
        [
          ["add", "A"],
          ["done", "A"],
          ["remove", "A"],
          ["add", "B"],
          ["done", "B"],
          ["add", "B"],
        ],
      ]
    expected: { "pending": [], "done": ["B"] }
    hidden: true
    description: "Suppression d'une tâche terminée et ajout d'une tâche déjà terminée"

