id: "safe_list_access"
title: "Accès sécurisé à une liste"
description: |
  Complète la fonction `safe_get(lst, index)` pour qu'elle renvoie l'élément de `lst` à l'indice `index`, ou le texte `"Error: Index out of range"` si cet indice n'existe pas.
  Les indices négatifs fonctionnent comme d'habitude.

  Exemples :
  - `safe_get([1, 2, 3], 1)` renvoie `2`
  - `safe_get([10, 20, 30], -1)` renvoie `30`
  - `safe_get([1, 2, 3], 5)` renvoie `"Error: Index out of range"`

template: |
  def safe_get(lst, index):
      # Utilise try/except pour accéder à lst[index]
      pass

solution: |
  def safe_get(lst, index):
      try:
          return lst[index]
      except IndexError:
          return "Error: Index out of range"

hints:
  - "Un indice trop grand lève une `IndexError`."

tests:
  - input: [[1, 2, 3], 1]
    expected: 2
    description: "Index valide"
  - input: [[1, 2, 3], 5]
    expected: "Error: Index out of range"
    description: "Index trop grand"
  - input: [[10, 20, 30], 0]
    expected: 10
    description: "Premier élément"
  - input: [[10, 20, 30], -1]
    expected: 30
    description: "Index négatif valide"
  - input: [[5], 10]
    expected: "Error: Index out of range"
    hidden: true
    description: "Index très grand"
  - input: [[], 0]
    expected: "Error: Index out of range"
    hidden: true
    description: "Liste vide"

en:
  title: "Safe list access"
  description: |
    Complete the function `safe_get(lst, index)` so that it returns the item of `lst` at index `index`, or the text `"Error: Index out of range"` if that index doesn't exist.
    Negative indexes work as usual.

    Examples:
    - `safe_get([1, 2, 3], 1)` returns `2`
    - `safe_get([10, 20, 30], -1)` returns `30`
    - `safe_get([1, 2, 3], 5)` returns `"Error: Index out of range"`
  template: |
    def safe_get(lst, index):
        # Use try/except to access lst[index]
        pass
  hints:
    - "An index that is too large raises an `IndexError`."
  tests:
    - "Valid index"
    - "Index too large"
    - "First element"
    - "Valid negative index"
    - "Very large index"
    - "Empty list"
