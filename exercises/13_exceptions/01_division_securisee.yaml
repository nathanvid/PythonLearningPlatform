id: "safe_division"
title: "Division sécurisée"
description: |
  Complète la fonction `safe_divide(a, b)` pour qu'elle renvoie `a / b`, ou le texte `"Error: Division by zero"` si `b` vaut 0.
  Utilise `try` / `except ZeroDivisionError`.

  Exemples :
  - `safe_divide(10, 2)` renvoie `5.0`
  - `safe_divide(10, 0)` renvoie `"Error: Division by zero"`

template: |
  def safe_divide(a, b):
      # Utilise try/except
      pass

solution: |
  def safe_divide(a, b):
      try:
          return a / b
      except ZeroDivisionError:
          return "Error: Division by zero"

hints:
  - "Le calcul va dans le `try`, le texte d'erreur dans le `except`."

tests:
  - input: [10, 2]
    expected: 5.0
    description: "Division normale"
  - input: [10, 0]
    expected: "Error: Division by zero"
    description: "Division par zéro"
  - input: [15, 3]
    expected: 5.0
    description: "Autre division"
  - input: [100, 0]
    expected: "Error: Division by zero"
    hidden: true
    description: "Test caché division par zéro"
  - input: [7, 2]
    expected: 3.5
    hidden: true
    description: "Division avec décimales"

