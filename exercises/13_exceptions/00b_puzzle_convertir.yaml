id: "parsons_parse_numbers"
type: parsons
title: "Puzzle : garder les nombres valides"
description: |
  Remets les lignes dans l'ordre pour obtenir une fonction convertir_nombres(textes)
  qui convertit chaque texte en entier et ignore ceux qui ne sont pas des entiers valides.

  Exemple : convertir_nombres(["1", "a", "3"]) → [1, 3]

solution: |
  def parse_numbers(texts):
      numbers = []
      for text in texts:
          try:
              numbers.append(int(text))
          except ValueError:
              pass
      return numbers

hints:
  - "La conversion `int(...)` peut échouer : elle doit être dans le `try`."

tests:
  - input: [["1", "a", "3"]]
    expected: [1, 3]
    description: "Un texte invalide"
  - input: [[]]
    expected: []
    description: "Liste vide"
  - input: [["x"]]
    expected: []
    description: "Aucun nombre valide"
  - input: [["-2", "4.5", "10"]]
    expected: [-2, 10]
    hidden: true
    description: "Négatif et décimal"

en:
  title: "Puzzle: keeping valid numbers"
  description: |
    Put the lines back in order to get a function parse_numbers(texts)
    that converts each text to an integer and skips those that aren't valid integers.

    Example: parse_numbers(["1", "a", "3"]) → [1, 3]
  solution: |
    def parse_numbers(texts):
        numbers = []
        for text in texts:
            try:
                numbers.append(int(text))
            except ValueError:
                pass
        return numbers
  hints:
    - "The conversion `int(...)` can fail: it must be inside the `try`."
  tests:
    - "One invalid text"
    - "Empty list"
    - "No valid number"
    - "Negative and decimal"
