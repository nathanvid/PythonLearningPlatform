id: "is_even"
title: "Nombre pair"
description: |
  Complète la fonction `is_even(n)` pour qu'elle renvoie `True` si `n` est pair, et `False` sinon.

  Un nombre est pair quand le reste de sa division par 2 vaut 0, c'est-à-dire quand `n % 2 == 0`.

  Exemples :
  - `is_even(4)` renvoie `True`
  - `is_even(7)` renvoie `False`
  - `is_even(0)` renvoie `True`

template: |
  def is_even(n):
      # Écris ton code ici
      pass

solution: |
  def is_even(n):
      return n % 2 == 0

hints:
  - "La comparaison `n % 2 == 0` vaut déjà `True` ou `False` : tu peux la renvoyer directement."

tests:
  - input: [4]
    expected: true
    description: "4 est pair"
  - input: [7]
    expected: false
    description: "7 est impair"
  - input: [0]
    expected: true
    description: "0 est pair"
  - input: [-2]
    expected: true
    description: "-2 est pair"
  - input: [-3]
    expected: false
    description: "-3 est impair"
  - input: [1000]
    expected: true
    hidden: true
    description: "Grand nombre pair"
  - input: [999]
    expected: false
    hidden: true
    description: "Grand nombre impair"

