id: "sum_range"
title: "Somme d'une plage"
description: |
  Complète la fonction `sum_range(n)` pour qu'elle renvoie la somme des nombres de `1` à `n`, calculée avec une boucle `for`.

  Exemples :
  - `sum_range(5)` renvoie `15` (1 + 2 + 3 + 4 + 5)
  - `sum_range(10)` renvoie `55`
  - `sum_range(0)` renvoie `0`

template: |
  def sum_range(n):
      # Utilise une boucle for
      pass

solution: |
  def sum_range(n):
      total = 0
      for i in range(1, n + 1):
          total += i
      return total

hints:
  - "Accumulateur créé avant la boucle, `range(1, n + 1)`, et `return` après la boucle."

tests:
  - input: [5]
    expected: 15
    description: "Somme de 1 à 5"
  - input: [10]
    expected: 55
    description: "Somme de 1 à 10"
  - input: [1]
    expected: 1
    description: "Un seul nombre"
  - input: [0]
    expected: 0
    description: "Zéro"
  - input: [100]
    expected: 5050
    hidden: true
    description: "Grande plage"

