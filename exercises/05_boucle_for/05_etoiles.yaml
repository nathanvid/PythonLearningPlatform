id: "star_triangle"
type: output
title: "Un triangle d'étoiles"
description: |
  Avec une boucle `for`, affiche un triangle de 4 lignes : la ligne numéro `i` contient `i` étoiles.
  Utilise la répétition de texte `"*" * i`.

  Le programme doit afficher exactement :

  ```text
  *
  **
  ***
  ****
  ```

template: |
  # Écris ta boucle ici

solution: |
  for i in range(1, 5):
      print("*" * i)

checks:
  constructs: [for]

hints:
  - "`\"*\" * 3` donne `***`."

