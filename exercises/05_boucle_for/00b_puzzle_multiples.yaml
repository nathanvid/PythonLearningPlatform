id: "parsons_count_multiples"
type: parsons
title: "Puzzle : compter les multiples de 3"
description: |
  Remets les lignes dans l'ordre pour compter les nombres de `1` à `20` qui sont des multiples de 3,
  puis afficher exactement :

  ```text
  6
  ```

  L'indentation est déjà correcte.

solution: |
  count = 0
  for n in range(1, 21):
      if n % 3 == 0:
          count += 1
  print(count)

hints:
  - "Le compteur est créé avant la boucle et affiché après."

en:
  title: "Puzzle: counting multiples of 3"
  description: |
    Put the lines back in order to count the numbers from `1` to `20` that are multiples of 3,
    then display exactly:

    ```text
    6
    ```

    The indentation is already right.
  solution: |
    count = 0
    for n in range(1, 21):
        if n % 3 == 0:
            count += 1
    print(count)
  hints:
    - "The counter is created before the loop and displayed after it."
