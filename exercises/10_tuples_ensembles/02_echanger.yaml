    - `rotate((1, 2, 3))` returns `(2, 3, 1)`
    - `rotate(("x", "y", "z"))` returns `("y", "z", "x")`
  template: |
    def rotate(triplet):
        # Unpack the triplet into three variables, then return them in the new order
        pass
  hints:
    - "`a, b, c = triplet`, then return the three variables in the new order."
  tests:
