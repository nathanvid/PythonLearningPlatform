[project]
name = "python-learning-platform"
version = "0.1.0"
description = "Plateforme d'apprentissage Python par exercices interactifs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
